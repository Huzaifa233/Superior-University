<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Profiling - Upload</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .container { margin-top: 80px; }
        .card { padding: 30px; border-radius: 15px; }
    </style>
</head>
<body>
<div class="container text-center">
    <h2 class="mb-4">😊 Upload Your Image for Face Analysis</h2>
    <div class="card shadow">
        <form method="POST" action="/upload" enctype="multipart/form-data">
            <input class="form-control mb-3" type="file" name="file" accept="image/*" required>
            <button type="submit" class="btn btn-primary">Analyze Face</button>
        </form>
    </div>
</div>
</body>
</html>
