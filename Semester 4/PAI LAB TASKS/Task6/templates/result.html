<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Profiling - Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #e9f7ef; }
        .container { margin-top: 50px; }
        .card { padding: 25px; border-radius: 15px; }
        img { border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="card shadow">
        <h2 class="mb-4">✅ Face Analyzed Successfully!</h2>
        <div class="row">
            <div class="col-md-6">
                <h5>Uploaded Image</h5>
                <img src="{{ input_image }}" width="300">
            </div>
            <div class="col-md-6">
                <h5>Processed Image</h5>
                <img src="{{ output_image }}" width="300">
            </div>
        </div>
        <p class="mt-4"><strong>{{ personality }}</strong></p>
        <a href="/" class="btn btn-success mt-3">🔄 Analyze Another Image</a>
    </div>
</div>
</body>
</html>
